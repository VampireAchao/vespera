# 维斯佩拉 · 世界总平面
#
# 这份文件讲**关系与手法**，不讲坐标。
# 坐标只有一处真相：`regions/regions.yml`。改坐标去改那一份，别在这里同步第二遍。
#
# 形态：混合。一块连续生存大陆（六区）+ 原版下界（熔炉之喉）+ 原版末地外岛（珍珠荒原）
#       + 一个独立终局世界（日轮庭院）。四个维度全是原版维度。
#
# 为什么选混合而不是"全传送门"：
#   走过一次的路会变成记忆，传送一次的路只是一个按钮。
#   六区必须能走过去，因为"去哪要准备什么"是这个游戏的生存考题；
#   但下界与末地本来就是"另一个世界"，那边用传送门反而是原版的正确用法。

## 平面关系

```
                        ▲ 北
         ┌──────────────────────────────┐
         │   白塔原（雪线之上）          │
         │        ↑ 翻两道垭口           │
         │   灰钟修道院（山脊背风面）    │
         │        ↑ 沿河谷上溯           │
         │   无声墓道（沼泽塌陷坑）      │
         │                              │
   ┌─────┴─────┐        ┌───────────────┴──┐
   │ 沉钟湖    │← 河 →  │   流明陨城（出生）│→ 石桥 → 钟塔学院
   │（大河变宽）│        │       ↓ 下界门   │
   └───────────┘        └───────┬──────────┘
                        ┌───────┴──────────┐
                        │  环月林（黑森林）│
                        └──────────────────┘
                        ▼ 南

  下界：熔炉之喉（玄武岩三角洲，与主城同一组 1:8 坐标）
  末地：珍珠荒原（外岛西北象限）
  独立：日轮庭院（轮心，终局）
```

## 六区为什么这样嵌

| 区 | 绑定群系 | 嵌进去的理由 |
|---|---|---|
| 流明陨城 | plains | 平原能种地、能建城、能看见远处的钟楼——它是"秩序"的地貌 |
| 钟塔学院 | forest | 林线包住校区，围墙只有一人高：看得见外面，出不去而已 |
| 灰钟修道院 | windswept_hills | 风蚀山脊本身就是"苦修"的形状；雷暴要真的打下来 |
| 环月林 | dark_forest | 树冠挡光，白天也暗——狼人线不需要额外调光照 |
| 沉钟湖 | river | 河变宽成湖是自然的事；水下有东西才需要解释 |
| 无声墓道 | swamp | 沼泽的浅水与腐烂，正好托住"地下有洞"的设定 |
| 白塔原 | jagged_peaks | 雪线以上没有植被，高度自己会说话 |

**一条总则：先选群系，再放建筑。** 反过来做，最后一定要靠大量手摆地形去补，补完就不像原版了。

## 边界：三种过渡，一条禁令

| 过渡类型 | 用在哪 | 做法 |
|---|---|---|
| 农作物渐变 | 城 → 野 | 农田 → 疏林 → 密林，三百格内完成 |
| 海拔渐变 | 山 → 雪 | 云杉林线 → 裸岩 → 雪，靠高度而非围栏 |
| 水域渐变 | 河 → 湖 → 沼泽 | 浅滩、芦苇、浮萍带 |

**禁令：不许出现直线边界。** 世界边界也不设 `worldborder` —— 需要"尽头"的地方用海、崖、虚空，
以及"被擦掉的地形"（半截建筑、断树）。这是设定，也是美术。

## 传送门的两条路

| 目标 | 走特定传送门 | 自己探索 |
|---|---|---|
| 熔炉之喉 | 主城任何一扇下界门 → 定向到入口平台（`portals` 规则） | 在地图别处搭门，从荒野穿过下界走过来 |
| 珍珠荒原 | 末地折跃门 → 外岛（原版机制） | 一颗末影珍珠，硬闯 |

两条路都得通。只有一条通的地图，实际上是"只能按设计者的路线走"。

## 建设顺序

1. **地形先行**：WorldPainter 出整块大陆，六区群系对齐，跑一遍 3000×3000。
2. **走一遍**：从出生点徒步走完六区，记下"哪里走不过去"。这一步最容易被跳过，也最贵。
3. **主城**：城墙、街道、钟楼、市场。钟楼的位置决定全图的天际线。
4. **学院**：见 `layouts/college.yml`（十一块建筑，独立粘贴）。
5. **其余五区的"一个地标"**：修道院的钟楼、湖底的钟、墓道的入口坑、白塔的塔基、林中的花原。
6. **装饰与机制**：NPC 锚点、祭坛（注意半径 7 格内的方块计数）、刷怪点、箱子里的文本。

第 5 步是刻意的：每区先只做一个地标，是为了在投入美术之前先验证"走过去值不值"。

## 验收清单

- [ ] 从出生点徒步到六区，全程不需要命令、不需要传送
- [ ] 每个区的群系与 `regions.yml` 一致（用 F3 看，不看图纸）
- [ ] 任一区的边界，站在里面看不到"一条直线"
- [ ] 主城任意一扇下界门，落点都在熔炉之喉的入口平台上
- [ ] 在荒野（如环月林深处）搭一扇门，落点仍是荒野
- [ ] 末地折跃门能到外岛；外岛结构顺着地形，没有削平的台地
- [ ] 祭坛周边半径 7 格内，装饰性黑曜石 / 萤石不超过阈值
- [ ] 走完一圈，没有一处需要"跳进虚空"才能到达
