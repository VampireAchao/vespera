# 内容闸门
#
# 这一份文件决定"哪些线在这个服务器上存在"。关着的线不会被生成，玩家看不到空白，
# 也看不到提示——它就是不发生。
#
# 规矩只有一条：**默认全关，要开自己改。** 拼错名字、改错缩进、整段被注释掉，
# 结果都是"关"。失败方向必须朝着安全那一边。
#
# 三道闸对应三类只在极少数情况下才成立的叙述：
#   bonds     关系线往深处走的那几场（不做任何身份标注，只写"两个人之间发生了什么"）
#   privacy   更衣、浴室、宿舍熄灯之后（一律只写门外的动静）
#   conflict  排挤、流言、被写在桌上（只写结果与反弹，不写过程）
#
# 即便全部打开，正文也必须遵守 docs/06 的写法：不命名、不解释、不描写。
# 闸门不是许可证，它只是"这段内容要不要存在"的开关。

gates:
  bonds: false
  privacy: false
  conflict: false
