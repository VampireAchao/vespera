# 维斯佩拉 · 运行期配置
#
# 这份文件里没有数值平衡，只有三件东西：钟怎么响、NPC 站哪儿、玩家从哪儿开始。
# 剧情数值（好感、风纪、暴露……）不在这里，它们在玩家身上，由剧本写入。

clock:
  # 校历时钟。关掉之后世界照常天黑，只是没人报时间了。
  enabled: true

  # 只对这个世界报时。多世界时改成对应的世界名。
  world: world

  # 晚钟的音色。原版钟，不引外部音频——音频是最容易踩版权的地方。
  sound: minecraft:block.bell.use

  # 每一段的第一刻会说一句话。缺省的那一段就不说话，安静地过。
  messages:
    MORNING_BELL: "第一声。天还没亮透。"
    ASSEMBLY: "朝礼的钟。操场集合。"
    MORNING_CLASSES: "上午两节。"
    LUNCH: "午休。食堂最挤，宿舍最空。"
    AFTERNOON_CLASSES: "下午两节。"
    CLUBS: "社团时间。"
    NIGHT: "晚钟散了。门禁在第六百刻之后——那时候还在校舍里的人，会被钟留下。"

# NPC 锚点。
#
# 这不是 Citizens 的替代品：它只做一件事——站着一个有名字的人，右键跟他说话。
# 需要皮肤、走动、巡逻、商人的时候再装 Citizens，锚点会退化成它的一个入口。
# 本方案先只用原版实体，是为了让"原版客户端可加入"这条底线在任何插件缺席时都成立。
npcs:
  - id: bell-monk
    name: "老修士"
    world: world
    # campus-gate 表示"站在校门外六格"，跟着校区原点走；也可以写 "8.5 65 8.5"
    at: campus-gate
    offset: "4 0 2"
    dialogue: bell-test
    enabled: true

# 世界资产目录（相对服务器根目录）。
#
# regions.yml、结构文件、布置清单都在这里，由 vespera-world 模块产出，./dev.sh 自动同步。
# 插件按这一份做区域判定与下界门定向——坐标的真相只有一处。
world:
  assets: vespera

# 管理员名单：进服即给 OP。
# 私人服里这是最省事的一步——不用改 ops.json，也不用记 UUID。
admins:
  - VampireAchao

# 主城（流明陨城）
#
# 出生点在这里，四十二条主线从这里出发。所以它是第一个该建的东西。
# 城 600×600：城墙、四门、环市集、七层圣座金字塔、王座大厅、城内角斗场、
# 神职四院、贵族府邸、贫民窟、中产区、南门旅人区与三座功能商铺。
# 墙外还有南港、农田、风车与北村。
#
# 首次启动会选址、整平、铺城，约 40–60 秒。之后按世界里的版本标记跳过。
city:
  auto: true
  world: world
  # 期望的中心。若这里是水或陡坡，会自动就近另选，并把结果记在世界里。
  #
  # 20261028 这张种子图在 (0,0) 是水面，第一次建城时自动退到了 (512,512)。
  # 现在把它写死：城心跟着 world 的实际位置走，regions.yml 也按 512 平移过。
  # 换种子时要重新对齐这三处——config 的 origin、regions.yml、以及旧的存档世界。
  origin-x: 512
  origin-z: 512
  pull-strays: true

# 校区灰盒（钟塔学院）
#
# 默认关闭：主城优先。想去看学院，控制台敲 `vespera build campus` 或把 auto 改 true。
# 它建在主城以东约 370 格，与 regions.yml 里 college 的范围一致。
campus:
  auto: false
  world: world
  origin-x: 370
  origin-z: 0
  pull-strays: true

# 剧本目录。留空则用插件自带的那几份示例。
dialogues:
  directory: dialogues
