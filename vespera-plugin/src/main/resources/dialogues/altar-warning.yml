# 「门是要砌的」——转化前一幕的标准写法。
#
# 设计书 10.1 铁律三：转化必须由玩家亲手完成，插件只认"右键金块"这个动作。
# 所以这段对话里没有一句"我赐予你"，只有材料清单、一个退开的动作，和一个不看的背影。
# 这段文本是这类场景的模板，不是孤例：八个种族，八段都长这样。

id: altar-warning
speaker: 薇拉
entry: door

nodes:
  door:
    lines:
      - "「门就在那儿。」"
      - "「二十块黑曜石，一块金块。你把它们摆好，然后自己按下去。」"
      - "「我不看。」她转过身去，肩膀抵着墙。"
    options:
      - label: "按下去了会怎样？"
        goto: price
      - label: "我需要什么？"
        goto: list
      - label: "（退开）"
        close: true
        tell: "你退了两步。她没回头，但肩膀松了一点。"

  list:
    lines:
      - "「一碗蘑菇煲、十根骨头、十份火药、十份红石。」"
      - "「前四样是药。最后一样是火。」"
    options:
      - label: "按下去了会怎样？"
        goto: price
      - label: "（退开）"
        close: true

  price:
    lines:
      - "「你会听见自己的心跳停一下。」"
      - "「然后体温从皮肤往里退。嘴里全是铁锈味。」"
      - "「第二天太阳出来，你就知道代价是什么了。」"
    options:
      - label: "（记住了）"
        close: true
        flags:
          - told_altar_price
